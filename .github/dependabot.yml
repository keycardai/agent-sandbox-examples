# Dependency updates as PRs. Each PR runs the same gates as any other change,
# so a vulnerability regression in an update fails CI.
#
# go.mod and mise.toml name the same Go version. A dependency update can
# raise the `go` directive in go.mod. Whenever it changes, set the same
# version in mise.toml and run `mise lock`.
version: 2
updates:
  # Covers the dependencies and the tool directives alike.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
