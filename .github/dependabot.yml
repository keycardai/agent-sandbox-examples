# Dependency updates as PRs. Each PR runs the same gates as any other change,
# so a vulnerability regression in an update fails CI.
#
# Dependabot does not move the `go` directive. Bump Go by hand in go.mod and
# mise.toml, then run `mise lock`.
version: 2
updates:
  # Covers the dependencies and the tool directives alike.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
