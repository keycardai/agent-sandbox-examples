# What the people who create sandboxes need in the namespace: the Sandbox, the
# user's ServiceAccount and ConfigMaps, and enough on pods to see a sandbox
# come up and to run commands inside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-admin
  namespace: {{ include "keycard-sandbox.namespace" . }}
  labels:
    {{- include "keycard-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
{{- with .Values.rbac.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-admin
  namespace: {{ include "keycard-sandbox.namespace" $ }}
  labels:
    {{- include "keycard-sandbox.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-admin
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
