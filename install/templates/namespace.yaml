apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "keycard-sandbox.namespace" . }}
  labels:
    {{- include "keycard-sandbox.labels" . | nindent 4 }}
    # Privileged is the lowest Pod Security level that admits an init
    # container adding NET_ADMIN and NET_RAW.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # Deleting the release must not delete every sandbox in the namespace.
    helm.sh/resource-policy: keep
