# Values for the keycard-sandbox chart.

# The URL of the zone that decides every token exchange. It is also the
# audience of the proxy's ServiceAccount token. Required.
zoneURL: ""

# Trust for a zone whose certificate is not signed by a public root. A zone
# on the internet does not need this.
zoneTrust:
  # The PEM roots that sign the zone's certificate. Setting it renders the
  # ConfigMap named below. A root certificate is public, so it goes in a
  # ConfigMap, never in a Secret.
  certificate: ""
  # The ConfigMap mounted on the proxy container. Leave it empty to mount
  # nothing. The sandbox chart writes <mountPath>/<key> into the proxy
  # document's tls.upstream_ca_files, which adds these roots to the system
  # roots. Give the sandbox chart the same configMap, key and mountPath.
  configMap: ""
  key: zone-ca.pem
  mountPath: /etc/keycard-zone-trust

# Host names mapped to addresses for every container in the pod, in the
# shape of the pod's hostAliases field. Give the sandbox chart the same list.
hostAliases: []
#  - ip: 192.168.97.1
#    hostnames: [acme.example.com]

# The sandbox pod's images. Each egress-proxy release publishes them under
# its version tag (docs/containers.md in egress-proxy), and lists their
# digests in the release's digests.txt. The defaults pin v0.2.1 by digest.
# The proxy reads listen.dns_port, which the sandbox chart writes, from
# v0.2.0 on.
images:
  netsetup: ghcr.io/keycardai/egress-netsetup:v0.2.1@sha256:cff8c7a98ebfadfb514ccc0840cfb7a67994711f7e7c405d309613e4611b5b33
  proxy: ghcr.io/keycardai/egress-proxy:v0.2.1@sha256:79684cf9b059d8e2f1719b108a05251bb47ef3bebb39759fd1811ec36b9ff7d2
  # The agent image, built FROM ghcr.io/keycardai/sandbox-base. The default
  # is the base image itself, as a placeholder agent.
  agent: ghcr.io/keycardai/sandbox-base:v0.2.1@sha256:555ef77f07de9e186e594aa3b0aa4805cfe7149ace065ca97d40fbc0e02c1cce

proxy:
  # The proxy's uid. The redirect and the DROP exempt it, so the proxy's own
  # traffic leaves the pod. It must match --proxy-uid in netsetup.args. The
  # proxy refuses to start otherwise.
  uid: 1337
  # The transparent listener the capture redirects to. It must match
  # --redirect-port in netsetup.args. It is below 1024, so only the proxy,
  # which holds NET_BIND_SERVICE, can bind it.
  redirectPort: 1015
  # net.ipv4.ip_unprivileged_port_start on the pod. Keep it above the higher
  # of redirectPort and the resolver port, 53. It is on the kubelet's safe
  # sysctl list (kubernetes/pkg/kubelet/sysctl/safe_sysctls.go), so it does
  # not need node configuration.
  unprivilegedPortStart: 1024
  # The ConfigMap that holds the proxy's configuration document, and the path
  # the proxy reads it from. Only the proxy mounts it, because it holds the
  # identity section. The sandbox chart does not read configMap. It makes one
  # ConfigMap per sandbox.
  configMap: egress-proxy-config
  configPath: /etc/egress/config.yaml
  # The directory of the proxy's ServiceAccount token. Set
  # identity.workload_token_file in the document to <tokenPath>/token.
  tokenPath: /var/run/secrets/keycard
  tokenExpirationSeconds: 3600
  # Each probe runs the proxy binary, which dials the admin socket at the
  # binary's default path. The admin socket is a Unix socket, not a TCP port,
  # and the agent does not mount it.
  #
  # The agent starts once readyz passes: every listener is bound and ca.crt
  # is written. Liveness reads healthz, so the kubelet does not restart a
  # proxy that is still starting.
  startupProbe:
    command: ["/ko-app/egress-proxy", "probe", "readyz"]
    periodSeconds: 1
    failureThreshold: 60
  livenessProbe:
    command: ["/ko-app/egress-proxy", "probe", "healthz"]
    periodSeconds: 10
  readinessProbe:
    command: ["/ko-app/egress-proxy", "probe", "readyz"]
    periodSeconds: 10

netsetup:
  # Arguments of the egress-netsetup init container. It redirects tcp/80 and
  # tcp/443 from every uid except the proxy's to the redirect port, and
  # udp/53 and tcp/53 to the proxy's resolver on --dns-port. The sandbox
  # chart sets listen.dns_port to 53, so --dns-port must be 53. It drops all
  # other traffic except the proxy's, loopback and established connections.
  # It writes a receipt of the rules it programmed to --receipt, on the
  # volume the proxy reads it from.
  #
  # Set every argument. egress-netsetup reads flags only, not environment
  # variables, and the netsetup image is pinned separately from the proxy
  # image. Each value must equal the one `egress-proxy settings` reports
  # under netsetup.
  args:
    - --proxy-uid=1337
    - --redirect-port=1015
    - --dns-port=53
    - --capture-ports=80,443
    - --ipv6=auto
    - --receipt=/run/egress/netsetup/netsetup.json

agent:
  # The agent's uid. Rendering fails if it equals proxy.uid.
  uid: 1000
  # Replaces the image's entrypoint. Empty keeps it. The sandbox-base
  # entrypoint installs the proxy's CA from /shared-ca/out/ca.crt before the
  # agent starts. That path is the default in both images, so neither
  # container sets it.
  command: []
  # The agent's command, which the sandbox-base entrypoint execs. The
  # entrypoint exits 64 when there are no args. `sleep infinity` keeps an idle
  # sandbox open for `kubectl exec`. Set the real agent's command here.
  args: ["sleep", "infinity"]

rbac:
  # Who is bound to the sandbox-admin Role. Empty renders the Role and no
  # RoleBinding.
  subjects: []
  #  - kind: Group
  #    name: sandbox-admins
  #    apiGroup: rbac.authorization.k8s.io

network:
  # This cluster's pod and service ranges. Each is added to the ranges the
  # sandbox NetworkPolicy blocks, in its own address family. They are usually
  # already inside a private range.
  clusterCIDRs: []
  # Single hosts in the private ranges the NetworkPolicy blocks, such as a
  # gateway to a zone on a private address. The sandbox can reach each one on
  # TCP 443. Each entry is a /32 for IPv4 or a /128 for IPv6. Rendering fails
  # on a wider prefix and on any address in 169.254.0.0/16, which holds the
  # cloud metadata address.
  allowCIDRs: []
