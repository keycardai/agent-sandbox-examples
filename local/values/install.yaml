# Install chart values for the local k3d cluster. run.sh passes this file,
# then local/out/install.values.yaml. That file holds the values that come
# from the running cluster and local.env: zoneURL, the Docker network gateway
# in hostAliases and network.allowCIDRs, and zoneTrust when
# KEYCARD_LOCAL_CA_FILE is set.

# Imported into the k3d node with `k3d image import`. A tag other than latest
# defaults imagePullPolicy to IfNotPresent, so nothing is pulled.
images:
  netsetup: ghcr.io/keycardai/egress-netsetup:local
  proxy: ghcr.io/keycardai/egress-proxy:local
  agent: ghcr.io/keycardai/sandbox-base:local

network:
  # The k3s default pod and service ranges (https://docs.k3s.io/cli/server).
  clusterCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
