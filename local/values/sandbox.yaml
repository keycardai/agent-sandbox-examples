# Sandbox chart values for the local k3d cluster. `sandbox run` passes
# sandbox/values.example.yaml for the endpoints, then this file, then
# local/out/sandbox.values.yaml with zoneURL, hostAliases, the images when
# KEYCARD_LOCAL_IMAGE_TAG is set, and zoneTrust when KEYCARD_LOCAL_CA_FILE is
# set. Every pod key here must hold the value local/values/install.yaml
# gives it.

policy:
  clusterCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
