# Sandbox chart values for the local k3d cluster. `sandbox run` passes
# sandbox/values.example.yaml, then this file, then
# local/out/sandbox.values.yaml with zoneURL, hostAliases, the images when
# KEYCARD_LOCAL_IMAGE_TAG is set, and zoneTrust when KEYCARD_LOCAL_CA_FILE is
# set, then local/out/scenario.values.yaml with the scenario's endpoints and
# agent.
# Every pod key here must hold the value local/values/install.yaml gives it.

policy:
  clusterCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
