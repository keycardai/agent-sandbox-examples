# The user's ServiceAccount, named for the user's IAM public id. A token the
# kubelet projects for this pod has the subject
# system:serviceaccount:<namespace>:<user-public-id>. The workload-identity
# credential is bound to that subject, and the zone's impersonation policy
# names it as the actor. A sandbox that runs as any other ServiceAccount
# fails every exchange with access_denied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycard-sandbox-user.userID" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycard-sandbox-user.labels" . | nindent 4 }}
  annotations:
    {{- include "keycard-sandbox-user.annotations" . | nindent 4 }}
# The only token in the pod is the projected token in the proxy container.
# Do not mount the default ServiceAccount token.
automountServiceAccountToken: false
