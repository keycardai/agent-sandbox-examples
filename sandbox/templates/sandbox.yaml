{{- $zoneURL := required "zoneURL is required: the zone that decides every token exchange" .Values.zoneURL -}}
{{- $user := include "keycard-sandbox-user.userID" . -}}
# One sandbox for one user. The pod is the pod of the install chart's
# SandboxTemplate, and the comments there explain each field.
# sandbox/README.md says why this chart repeats it. The tests in
# internal/chart check that the two pods match.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycard-sandbox-user.labels" . | nindent 4 }}
  annotations:
    {{- include "keycard-sandbox-user.annotations" . | nindent 4 }}
spec:
  # Nothing in the cluster connects to a sandbox. It does not need a Service.
  service: false
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        linkerd.io/inject: disabled
        kuma.io/sidecar-injection: disabled
        appmesh.k8s.aws/sidecarInjectorWebhook: disabled
    spec:
      # The user's ServiceAccount. serviceaccount.yaml says why its name is
      # the user's public id.
      serviceAccountName: {{ $user }}
      automountServiceAccountToken: false
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      shareProcessNamespace: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: {{ .Values.proxy.unprivilegedPortStart | quote }}
        # NEVER set fsGroup. Kubernetes adds every container to that group,
        # including the agent, and gives that group read and write on each
        # volume.
      initContainers:
        - name: egress-netsetup
          image: {{ .Values.images.netsetup }}
          args:
            {{- toYaml .Values.netsetup.args | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW", "SETPCAP"]
          volumeMounts:
            - name: xtables-run
              mountPath: /run
            - name: egress-run
              mountPath: /run/egress
        - name: egress-proxy
          image: {{ .Values.images.proxy }}
          restartPolicy: Always
          args:
            - --config={{ .Values.proxy.configPath }}
          securityContext:
            runAsUser: {{ .Values.proxy.uid }}
            runAsGroup: {{ .Values.proxy.uid }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # NEVER remove NET_BIND_SERVICE. The kernel refuses to exec the
              # binary without it.
              add: ["NET_BIND_SERVICE"]
          startupProbe:
            exec:
              command:
                {{- toYaml .Values.proxy.startupProbe.command | nindent 16 }}
            periodSeconds: {{ .Values.proxy.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.proxy.startupProbe.failureThreshold }}
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.proxy.livenessProbe.command | nindent 16 }}
            periodSeconds: {{ .Values.proxy.livenessProbe.periodSeconds }}
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.proxy.readinessProbe.command | nindent 16 }}
            periodSeconds: {{ .Values.proxy.readinessProbe.periodSeconds }}
          volumeMounts:
            - name: egress-run
              mountPath: /run/egress
            - name: egress-config
              mountPath: {{ dir .Values.proxy.configPath }}
              readOnly: true
            - name: keycard-token
              mountPath: {{ .Values.proxy.tokenPath }}
              readOnly: true
            - name: ca-key
              mountPath: /var/lib/egress/ca
            - name: shared-ca
              mountPath: /shared-ca
            {{- if .Values.zoneTrust.configMap }}
            - name: zone-trust
              mountPath: {{ .Values.zoneTrust.mountPath }}
              readOnly: true
            {{- end }}
      containers:
        - name: agent
          image: {{ .Values.images.agent }}
          {{- with .Values.agent.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agent.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.agent.uid }}
            runAsGroup: {{ .Values.agent.uid }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: shared-ca
              mountPath: /shared-ca
              readOnly: true
      volumes:
        - name: egress-run
          emptyDir:
            medium: Memory
        - name: ca-key
          emptyDir:
            medium: Memory
        - name: shared-ca
          emptyDir: {}
        - name: xtables-run
          emptyDir:
            medium: Memory
        - name: egress-config
          configMap:
            name: {{ include "keycard-sandbox-user.proxyConfigMap" . }}
        {{- if .Values.zoneTrust.configMap }}
        - name: zone-trust
          configMap:
            name: {{ .Values.zoneTrust.configMap }}
        {{- end }}
        - name: keycard-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $zoneURL | quote }}
                  expirationSeconds: {{ .Values.proxy.tokenExpirationSeconds }}
