# The proxy's configuration document, with the identity section. Only the
# proxy container mounts it. The proxy reads it once at start-up, so an edit
# takes effect only when the sandbox is recreated. The key is the file name
# in the proxy's --config argument.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycard-sandbox-user.proxyConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycard-sandbox-user.labels" . | nindent 4 }}
  annotations:
    {{- include "keycard-sandbox-user.annotations" . | nindent 4 }}
data:
  {{ base .Values.proxy.configPath }}: |
    {{- include "keycard-sandbox-user.document" . | nindent 4 }}
